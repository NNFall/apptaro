pid /run/nginx-asapptaro.pid;
error_log /var/log/nginx/asapptaro-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/asapptaro-access.log;
    server_tokens off;

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name 185-171-83-116.sslip.io;

        ssl_certificate /etc/letsencrypt/live/185-171-83-116.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/185-171-83-116.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        include /etc/nginx/snippets/asapptaro-proxy.conf;
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name slide-maker-ai.com;

        ssl_certificate /etc/letsencrypt/live/slide-maker-ai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/slide-maker-ai.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        include /etc/nginx/snippets/asapptaro-proxy.conf;
    }
}
