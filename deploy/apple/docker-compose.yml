name: asapptaro

services:
  asapptaro_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asapptaro_backend
    restart: unless-stopped
    env_file:
      - ./.env.backend
    environment:
      APP_NAME: ASapptaro Backend
      APP_ENV: production
      DATA_DIR: /data
      DATABASE_PATH: /data/asapptaro.db
      TEMP_DIR: /app/runtime/temp
      TEMPLATES_DIR: /app/runtime/templates
      TAROT_CARDS_DIR: /app/runtime/tarot/cards
      TAROT_BACKGROUND_PATH: /app/runtime/tarot/backgrounds/main.png
      TAROT_LAYOUT_PATH: /app/runtime/tarot/layout.json
      APP_STORE_PRIVATE_KEY_PATH: /run/secrets/apple/AuthKey.p8
      APP_STORE_ROOT_CERTIFICATES_DIR: /run/secrets/apple/root-certificates
    ports:
      - "127.0.0.1:8023:8000"
    volumes:
      - /root/ASapptaro/data:/data
      - /root/ASapptaro/templates:/app/runtime/templates:ro
      - /root/ASapptaro/tarot:/app/runtime/tarot:ro
      - /root/ASapptaro/temp:/app/runtime/temp
      - /root/ASapptaro/logs:/app/logs
      - /root/ASapptaro/secrets/apple/AuthKey.p8:/run/secrets/apple/AuthKey.p8:ro
      - /root/ASapptaro/secrets/apple/root-certificates:/run/secrets/apple/root-certificates:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,urllib.request;
          payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/health',timeout=5));
          raise SystemExit(0 if payload.get('status') == 'ok' else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  asapptaro_admin_bot:
    build:
      context: .
      dockerfile: ./telegram_admin_bot/Dockerfile
    container_name: asapptaro_admin_bot
    restart: unless-stopped
    env_file:
      - ./.env.admin
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/asapptaro.db
      ADMIN_DATABASE_PATH: /data/asapptaro.db
      ADMIN_BOT_HEARTBEAT_PATH: /tmp/admin_bot.heartbeat
    volumes:
      - /root/ASapptaro/data:/data
    depends_on:
      asapptaro_backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/admin_bot.heartbeat &&
          [ $$(($$(date +%s)-$$(stat -c %Y /tmp/admin_bot.heartbeat))) -lt 180 ]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
